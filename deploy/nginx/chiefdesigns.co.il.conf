# ═══════════════════════════════════════════════════════════════
#  chiefdesigns.co.il — פרודקשן
#  מותאם לשרת בפועל: nginx 1.26.0, IPv6 פעיל, Ubuntu.
#
#  מחליף את /etc/nginx/sites-enabled/chiefdesigns-new
#
#  ⚠ ה-root כאן הוא /var/www/chiefdesigns-next/current — תיקייה
#  חדשה. /var/www/chiefdesigns הישנה לא נמחקת ולא זזה; היא נשארת
#  בדיוק כפי שהיא ומשמשת רשת ביטחון. אם משהו משתבש, מחזירים את
#  השורה root לערך הישן ועושים reload — והאתר הישן חוזר מיידית.
#
#  התקנה:
#    sudo cp chiefdesigns.co.il.conf /etc/nginx/sites-available/
#    sudo nginx -t
#  (ההפעלה עצמה — רק ביום ההחלפה, ראה server-setup.md שלב 7)
# ═══════════════════════════════════════════════════════════════

# ── הגדרות TLS ──
# כתובות התעודה זהות לקונפיג הקיים, כך שחידוש certbot ממשיך לעבוד.
# ההגדרות עצמן כתובות כאן במפורש ולא דרך include של certbot, כדי
# שהקובץ יהיה עצמאי ולא יישבר אם options-ssl-nginx.conf חסר.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chiefdesigns.co.il www.chiefdesigns.co.il;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://chiefdesigns.co.il$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.chiefdesigns.co.il;

    ssl_certificate     /etc/letsencrypt/live/chiefdesigns.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chiefdesigns.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://chiefdesigns.co.il$request_uri;
}

# האתר עצמו
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chiefdesigns.co.il;

    ssl_certificate     /etc/letsencrypt/live/chiefdesigns.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chiefdesigns.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ה-symlink שה-Action מחליף. אף פעם לא מצביעים ישירות לרילוז.
    root  /var/www/chiefdesigns-next/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/rss+xml;

    # ═══ מיפוי מהאתר הישן — שלב 7 ═══
    #
    # האתר הישן היה עמוד בודד עם עוגנים. העוגנים
    # (#home, #services, #portfolio, #about, #contact) נשמרו זהים
    # בקוד החדש והדפדפן מטפל בהם — אין להם ריידיירקט ואין בהם צורך.
    #
    # ⚠ /index.html מטופל דרך $request_uri ולא דרך location.
    # הסיבה: ההנחיה 'index index.html' גורמת ל-nginx לתרגם פנימית
    # בקשה ל-/ אל /index.html. location = /index.html היה תופס גם את
    # התרגום הפנימי ומחזיר 301 ל-/ — לולאה אינסופית שמפילה את עמוד
    # הבית. $request_uri מכיל את מה שהדפדפן ביקש במקור.
    if ($request_uri ~ ^/index\.html(\?|$)) {
        return 301 https://chiefdesigns.co.il/;
    }

    location = /privacy.html { return 301 https://chiefdesigns.co.il/privacy/; }
    location = /terms.html   { return 301 https://chiefdesigns.co.il/terms/; }
    location = /privacy      { return 301 https://chiefdesigns.co.il/privacy/; }
    location = /terms        { return 301 https://chiefdesigns.co.il/terms/; }

    # ── קאשינג ──
    # כל location שמוסיף כותרת חייב לכלול מחדש את קובץ האבטחה:
    # ב-nginx, add_header בתוך location מבטל את אלה שמעליו במקום
    # להצטרף אליהם. בלי ה-include הזה עמודי ה-HTML היו יוצאים בלי
    # אף כותרת אבטחה.
    #
    # ואין כאן 'expires' — הוא פולט Cache-Control משלו, ואז יוצאות
    # שתי כותרות סותרות.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /images/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── ניתוב ──
    # trailingSlash: true ב-next.config מייצר /privacy/index.html
    #
    # ⚠ האיבר האחרון הוא =404 ולא /404.html: try_files שמסתיים בקובץ
    # מגיש אותו עם סטטוס 200, כלומר גוגל היה מאנדקס כל כתובת שגויה
    # כעמוד תקין. error_page למטה מגיש את העמוד המעוצב עם 404 אמיתי.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    access_log /var/log/nginx/chiefdesigns.access.log;
    error_log  /var/log/nginx/chiefdesigns.error.log;
}

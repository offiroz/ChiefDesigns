# ═══════════════════════════════════════════════════════════════
#  staging.chiefdesigns.co.il — סביבת בדיקות
#
#  שתי הגנות מפני האסון הקלאסי, שגוגל מאנדקס את גרסת הביניים
#  ומוריד לך את הדירוג בגלל תוכן כפול:
#    1. robots.txt חוסם — נוצר בבנייה לפי NEXT_PUBLIC_SITE_ENV
#    2. כותרת X-Robots-Tag: noindex — חגורה ושלייקס, מרמת השרת
#
#  ובנוסף סיסמה, כדי שלקוח סקרן לא ינחת על אתר חצי בנוי.
#
#  יצירת הסיסמה:
#    sudo apt install -y apache2-utils
#    sudo htpasswd -c /etc/nginx/.htpasswd-staging offir
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name staging.chiefdesigns.co.il;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://staging.chiefdesigns.co.il$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.chiefdesigns.co.il;

    ssl_certificate     /etc/letsencrypt/live/staging.chiefdesigns.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.chiefdesigns.co.il/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /var/www/chiefdesigns-staging/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ── חסימת אינדוקס. לא להסיר. ──
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ── סיסמה ──
    auth_basic           "Chief Designs — סביבת בדיקות";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    include /etc/nginx/snippets/security-headers.conf;

    gzip       on;
    gzip_vary  on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # בסטייג'ינג לא רוצים קאש בכלל — רוצים לראות את השינוי האחרון.
    add_header Cache-Control "no-store" always;

    # =404 ולא /404.html — אחרת כל כתובת שגויה מוחזרת עם סטטוס 200
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    access_log /var/log/nginx/chiefdesigns-staging.access.log;
    error_log  /var/log/nginx/chiefdesigns-staging.error.log;
}

# ═══════════════════════════════════════════════════════════════
#  כותרות אבטחה משותפות.
#
#  למה קובץ נפרד ולא פעם אחת ב-server:
#  ב-nginx, add_header בתוך location *מבטל* את כל ה-add_header
#  שהוגדרו ברמה שמעליו — הוא לא מתווסף אליהם. כלומר כל location
#  שמגדיר Cache-Control משלו היה מאבד בשקט את כותרות האבטחה.
#  לכן כל location כזה עושה include לקובץ הזה.
#
#  התקנה:
#    sudo mkdir -p /etc/nginx/snippets
#    sudo cp security-headers.conf /etc/nginx/snippets/
# ═══════════════════════════════════════════════════════════════

add_header X-Content-Type-Options    "nosniff"          always;
add_header X-Frame-Options           "SAMEORIGIN"       always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── Content-Security-Policy ──
# סעיף 8 ברשימת התיקונים.
#
# 'unsafe-inline' ב-script-src נדרש כי Next.js מזריק סקריפט hydration
# inline, ובאתר סטטי אין שרת שייצר nonce לכל בקשה. זה מחליש את ההגנה
# מפני XSS, אבל באתר בלי קלט משתמש ובלי צד שרת משטח התקיפה מזערי.
# frame-ancestors מחליף למעשה את X-Frame-Options בדפדפנים מודרניים —
# שניהם כאן, כדי לכסות גם ישנים.
#
# המדיניות כאן מתירה את Google Ads (AW-17466147922) ואת Microsoft
# Clarity, ששניהם הועברו מהאתר הישן. אם מסירים אחד מהם — להסיר גם
# את הדומיינים שלו כאן; CSP צר יותר = הגנה טובה יותר.
#
# ⚠ כל כלי צד-שלישי חדש חייב שורה כאן, אחרת הדפדפן חוסם אותו בשקט
#   ונראה כאילו המעקב עובד כשהוא לא. לבדיקה: קונסולת הדפדפן,
#   שגיאות שמתחילות ב-"Refused to load".
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://*.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://*.clarity.ms https://www.google.com https://googleads.g.doubleclick.net; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.clarity.ms https://*.google.com https://*.doubleclick.net; form-action 'self' https://wa.me; frame-src https://td.doubleclick.net https://www.googletagmanager.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

# גרסה מחמירה, בלי כלי צד שלישי — אם יום אחד מסירים את שניהם:
#
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
